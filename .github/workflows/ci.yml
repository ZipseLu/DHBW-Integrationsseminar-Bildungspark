name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

# Neuer Lauf, sobald derselbe Branch erneut gepusht wird
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ==========================================================================
  # 1) Lint + Typecheck + Unit-Tests (schnellste Feedback-Schleife)
  # ==========================================================================
  unit:
    name: Unit-Tests
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        app: [backend, frontend]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/${{ matrix.app }}/package-lock.json

      - name: Installieren
        working-directory: apps/${{ matrix.app }}
        run: npm ci

      # Das Backend ist reines JavaScript und hat keinen Build-Schritt.
      # Stattdessen: Syntaxpruefung ueber alle Quelldateien.
      - name: Syntax pruefen (Backend)
        if: matrix.app == 'backend'
        working-directory: apps/${{ matrix.app }}
        run: npm run check

      # Beim Frontend faengt der Build Vue-SFC- und Templatefehler ab,
      # die kein Test sonst sieht.
      - name: Build (Frontend)
        if: matrix.app == 'frontend'
        working-directory: apps/${{ matrix.app }}
        run: npm run build

      - name: Tests
        working-directory: apps/${{ matrix.app }}
        run: npm run test:run

  # ==========================================================================
  # 2) Integrationstests (Supertest + echte MySQL)
  # ==========================================================================
  backend-integration:
    name: Backend-Integrationstests
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root-dev
          MYSQL_DATABASE: bildungspark_test
          MYSQL_USER: bildungspark
          MYSQL_PASSWORD: bildungspark-dev
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysql -h 127.0.0.1 -u root -proot-dev -e 'SELECT 1'"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
          --health-start-period=30s

    env:
      NODE_ENV: test
      DB_HOST: 127.0.0.1
      DB_PORT: '3306'
      DB_NAME: bildungspark_test
      DB_USER: bildungspark
      DB_PASSWORD: bildungspark-dev
      AI_PROVIDER: gemini

    defaults:
      run:
        working-directory: apps/backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/backend/package-lock.json

      - run: npm ci

      - name: Tests mit Coverage
        run: npm run test:run -- --coverage

      - name: Coverage als Artefakt hochladen
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-coverage
          path: apps/backend/coverage
          retention-days: 7

  # ==========================================================================
  # 3) End-to-End (Playwright) – startet den vollen Stack selbst
  # ==========================================================================
  e2e:
    name: End-to-End (Playwright)
    runs-on: ubuntu-latest
    needs: unit

    env:
      PLAYWRIGHT_BASE_URL: http://localhost:5173
      PLAYWRIGHT_API_URL: http://localhost:3000

    defaults:
      run:
        working-directory: e2e

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: e2e/package-lock.json

      - run: npm ci

      - name: Browser installieren
        run: npx playwright install --with-deps chromium

      # MySQL als Service-Container
      - name: MySQL starten
        run: docker compose up -d db
        env:
          MYSQL_ROOT_PASSWORD: root-dev

      # Backend + Frontend als Docker-Services
      - name: Backend und Frontend starten
        run: docker compose up -d --build backend frontend

      - name: Auf bereit warten
        run: |
          echo "Warte auf Backend ..."
          for i in $(seq 1 60); do
            if curl -fsS http://localhost:3000/api/health > /dev/null 2>&1; then
              echo "Backend ist bereit."
              exit 0
            fi
            sleep 2
          done
          echo "Backend wurde nicht rechtzeitig bereit."
          docker compose logs --no-color --tail=100
          exit 1

      - name: E2E-Tests
        run: npx playwright test

      - name: Playwright-Report hochladen
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: e2e/playwright-report
          retention-days: 7

      - name: Screenshots & Videos hochladen
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-media
          path: e2e/test-results
          retention-days: 7

      - name: Container-Logs
        if: failure()
        run: docker compose logs --no-color --tail=200

  # ==========================================================================
  # 4) Docker-Builds pruefen (faengt Dockerfile-Fehler vor dem Deploy ab)
  # ==========================================================================
  docker-build:
    name: Docker-Build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Frontend-Produktions-Image
        uses: docker/build-push-action@v6
        with:
          context: ./apps/frontend
          file: ./apps/frontend/Dockerfile
          target: prod
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Backend-Produktions-Image
        uses: docker/build-push-action@v6
        with:
          context: ./apps/backend
          file: ./apps/backend/Dockerfile
          target: prod
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Compose-Konfiguration validieren
        run: docker compose config --quiet
