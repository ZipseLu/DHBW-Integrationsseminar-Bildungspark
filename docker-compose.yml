# =============================================================================
# Bildungspark - Arbeitsblattverwaltung
# Docker Compose Setup (Prototyp / 2-Wochen-Sprint)
#
# Schnellstart:
#   docker compose up                  # Frontend (Dev) + Postgres
#   docker compose --profile backend up # + Backend-API + Redis
#   docker compose --profile prod up    # Frontend als Nginx-Build (Demo)
#
# URLs:
#   Frontend (Dev)   http://localhost:8443
#   Frontend (Prod)  http://localhost:8080
#   Backend API      http://localhost:3001
#   Postgres         localhost:5432  (DB: bildungspark / User: postgres)
#
# Hinweis: Variablen kommen aus .env (siehe .env.example).
# =============================================================================

name: bildungspark

services:
  # ---------------------------------------------------------------------------
  # Frontend - Vite Dev-Server mit Hot Reload (Standardprofil)
  # ---------------------------------------------------------------------------
  frontend:
    build:
      context: ./ArbeitsblattverwaltungMockup
      dockerfile: Dockerfile
      target: dev
    image: bildungspark/frontend:dev
    container_name: bp-frontend
    ports:
      - "${FRONTEND_PORT:-8443}:8443"
    environment:
      # Vite lauscht auf 0.0.0.0, damit der Port im Container erreichbar ist
      FIGMA_DEV_SERVER_HOST: "0.0.0.0"
      PORT: "8443"
      # Backend vom Browser aus erreichbar (Host-Port, nicht Container-Name)
      VITE_API_URL: "${PUBLIC_API_URL:-http://localhost:3001/api}"
      WATCHPACK_POLLING: "true" # noetig wegen Windows-Bind-Mounts (HMR-Dateiwatching)
    volumes:
      # Quellcode live einbinden -> Aenderungen sofort sichtbar
      - ./ArbeitsblattverwaltungMockup:/app
      # node_modules NICHT vom Host mounten (Windows/Symlink-Probleme mit pnpm)
      - frontend_node_modules:/app/node_modules
    networks:
      - bp-net
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # Frontend - Produktions-Build via Nginx (Profil: prod)
  # ---------------------------------------------------------------------------
  frontend-prod:
    build:
      context: ./ArbeitsblattverwaltungMockup
      dockerfile: Dockerfile
      target: prod
    image: bildungspark/frontend:prod
    container_name: bp-frontend-prod
    profiles: ["prod"]
    ports:
      - "${FRONTEND_PROD_PORT:-8080}:80"
    environment:
      VITE_API_URL: "${PUBLIC_API_URL:-http://localhost:3001/api}"
    networks:
      - bp-net
    depends_on:
      - backend
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # Backend - Node/Express API (Profil: backend)
  # Ordner ./backend wird mit Ticket BE-AB-01 erstellt.
  # ---------------------------------------------------------------------------
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: bildungspark/backend:dev
    container_name: bp-backend
    profiles: ["backend"]
    ports:
      - "${BACKEND_PORT:-3001}:3001"
    environment:
      NODE_ENV: development
      PORT: "3001"
      DATABASE_URL: "postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-bildungspark}"
      JWT_SECRET: "${JWT_SECRET:-dev-secret-bitte-in-prod-aendern}"
      OPENAI_API_KEY: "${OPENAI_API_KEY:-}"
      FRONTEND_URL: "${PUBLIC_FRONTEND_URL:-http://localhost:8443}"
      CORS_ORIGIN: "${PUBLIC_FRONTEND_URL:-http://localhost:8443}"
    volumes:
      - ./backend:/app
      - backend_node_modules:/app/node_modules
    networks:
      - bp-net
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # Datenbank - PostgreSQL
  # ---------------------------------------------------------------------------
  db:
    image: postgres:16-alpine
    container_name: bp-db
    environment:
      POSTGRES_USER: "${POSTGRES_USER:-postgres}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-postgres}"
      POSTGRES_DB: "${POSTGRES_DB:-bildungspark}"
      # Deutsche Sortierung/Sortierregeln
      POSTGRES_INITDB_ARGS: "--locale=C.UTF-8 --encoding=UTF8"
    volumes:
      - db_data:/var/lib/postgresql/data
      # .sql-Dateien hier ablegen -> werden beim ERSTEN Start ausgefuehrt
      - ./db/init:/docker-entrypoint-initdb.d:ro
    ports:
      # Nur fuer lokale Tools (pgAdmin, DBeaver, psql)
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-bildungspark}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - bp-net
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # Redis - Cache / Sessions / Rate-Limiting (Profil: backend)
  # ---------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: bp-redis
    profiles: ["backend"]
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "256mb", "--maxmemory-policy", "allkeys-lru"]
    volumes:
      - redis_data:/data
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - bp-net
    restart: unless-stopped

# =============================================================================
# Netzwerk & Volumes
# =============================================================================
networks:
  bp-net:
    name: bp-net
    driver: bridge

volumes:
  frontend_node_modules:
  backend_node_modules:
  db_data:
  redis_data:
